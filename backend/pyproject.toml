[project]
name = "basicauth"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.164.0",
    "pwdlib[argon2]>=0.4.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.34",
    "sqlmodel>=0.0.50",
]

[tool.fastapi]
entrypoint = "main:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
